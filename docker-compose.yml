# Нужен ТОЛЬКО для VPS/своего сервера. Для Railway/Render — не трогай.
name: vpn-xray
services:
  vpn:
    build: .
    container_name: vpn-xray
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      INTERNAL_PORT: 8081
      # Пусто = UUID вычислится сам из домена. Можно задать свой:
      UUID: ${UUID:-}
      XHTTP_PATH: ${XHTTP_PATH:-/api/uploadFile/}
      XHTTP_MODE: ${XHTTP_MODE:-packet-up}
      DOMAIN: ${DOMAIN:-}
    env_file:
      - path: .env
        required: false
  # Профиль TLS: свой домен + авто-HTTPS через Caddy (для VPS).
  # Запуск: DOMAIN=vpn.example.com docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-}
    depends_on:
      - vpn
    profiles: ["tls"]
volumes:
  caddy_data:
