plugins {
    id 'com.android.application'
}

def buildValue = { String propertyName, String environmentName ->
    providers.gradleProperty(propertyName)
        .orElse(providers.environmentVariable(environmentName))
        .getOrElse('')
}
def asBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def turnUrls = buildValue('turnUrls', 'TURN_URLS')
def turnUsername = buildValue('turnUsername', 'TURN_USERNAME')
def turnCredential = buildValue('turnCredential', 'TURN_CREDENTIAL')
def appVersionCode = providers.gradleProperty('appVersionCode')
        .orElse(providers.environmentVariable('APP_VERSION_CODE'))
        .getOrElse('1').toInteger()
def appVersionName = providers.gradleProperty('appVersionName')
        .orElse(providers.environmentVariable('APP_VERSION_NAME'))
        .getOrElse('1.0.0')
def releaseStoreFile = providers.environmentVariable('ANDROID_SIGNING_STORE_FILE').getOrElse('')
def releaseStorePassword = providers.environmentVariable('ANDROID_SIGNING_STORE_PASSWORD').getOrElse('')
def releaseKeyAlias = providers.environmentVariable('ANDROID_SIGNING_KEY_ALIAS').getOrElse('noirp2p-release')
def releaseKeyPassword = providers.environmentVariable('ANDROID_SIGNING_KEY_PASSWORD').getOrElse('')

android {
    namespace 'com.noir.p2pchat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noir.p2pchat'
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        buildConfigField 'String', 'TURN_URLS', asBuildConfigString(turnUrls)
        buildConfigField 'String', 'TURN_USERNAME', asBuildConfigString(turnUsername)
        buildConfigField 'String', 'TURN_CREDENTIAL', asBuildConfigString(turnCredential)

        // The WebRTC AAR contains native libraries for four ABIs; ship only the requested 64-bit ARM ABI.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (!releaseStoreFile.isEmpty()) {
                storeFile rootProject.file(releaseStoreFile)
                storeType 'PKCS12'
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            excludes += ['**/libsignal_jni_testing.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/INDEX.LIST',
                'libsignal_jni*.dylib',
                'signal_jni*.dll'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.core:core:1.17.0'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'org.signal:libsignal-android:0.105.0'
    implementation 'org.signal:libsignal-client:0.105.0'
    testImplementation 'junit:junit:4.13.2'
}
