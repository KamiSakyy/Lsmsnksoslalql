plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing/keystore.properties')
if (!signingPropertiesFile.isFile()) {
    throw new GradleException('Missing persistent Tsuyu release keystore. Keep signing/tsuyu-release.p12 and signing/keystore.properties together.')
}
signingPropertiesFile.withInputStream { signingProperties.load(it) }
def buildVersionCode = System.getenv('TSUYU_VERSION_CODE') ? Integer.parseInt(System.getenv('TSUYU_VERSION_CODE')) : 1
def buildVersionName = findProperty('tsuyuVersionName') ?: '1.1'

android {
    namespace 'com.tsuyu.messenger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tsuyu.messenger'
        minSdk 26
        targetSdk 36
        versionCode buildVersionCode
        versionName buildVersionName
        // Ship only the resources the app can actually show: one language and
        // no library translations. Cuts a large slice of the resource table.
        resourceConfigurations += ['ru']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Package only the native ABI used by modern Android phones; a universal APK
        // bundles every Signal native library and is unnecessarily hundreds of MB.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        release {
            storeFile rootProject.file(signingProperties.getProperty('storeFile'))
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
            storeType signingProperties.getProperty('storeType', 'PKCS12')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            // R8 removes unused code and reflection-safe renaming; resource
            // shrinking then drops every unreachable layout/drawable/string.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libsignal_jni_testing.so']
            // Deflate the Signal native library inside the APK: extraction at
            // install time is a fair trade for ~8 MB less to download.
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                '/META-INF/AL2.0',
                '/META-INF/LGPL2.1',
                '**/libsignal_jni_*.so',
                '**/libsignal_jni*.dylib',
                '**/signal_jni*.dll'
            ]
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.transition:transition:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Navigation drawer from the web client design.
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // In-app circular video notes: camera preview plus MP4 recording.
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-video:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Official Signal Protocol implementation (PQXDH + Double Ratchet).
    implementation 'org.signal:libsignal-android:0.105.0'
    // P2P звонки: Stream WebRTC для Android — новая Android-сборка WebRTC
    // (io.getstream:stream-webrtc-android, Maven Central 2026), arm64-натив внутри.
    implementation 'io.getstream:stream-webrtc-android:1.3.10'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
