name: Voice Clone (XTTS-v2 + Chatterbox 0.5B)

on:
  push:
    branches: ["arena/3c5007be-lsmsnksoslalql"]
    paths:
      - "voice-clone/clone.py"
      - "voice-clone/requirements.txt"
      - ".github/workflows/voice-clone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      COQUI_TOS_AGREED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Кэш моделей (HF ~4-6 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: voice-clone-models-v1

      - name: Установка ffmpeg (на новых образах его нет)
        shell: bash
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || echo "apt не смог, будет imageio-ffmpeg"
          fi
          pip install imageio-ffmpeg
          ffmpeg -version 2>/dev/null | head -1 || echo "используем статичный imageio-ffmpeg"

      - name: Окружение XTTS-v2 (отдельный venv, transformers<5)
        shell: bash
        run: |
          mkdir -p voice-clone/_work
          python -m venv .venv-xtts
          .venv-xtts/bin/pip install --upgrade pip -q
          .venv-xtts/bin/pip install -q torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          .venv-xtts/bin/pip install -q "numpy<2" soundfile imageio-ffmpeg TTS==0.22.0
          # TTS тянет transformers 5.x, а XTTS-v2 требует BeamSearchScorer (есть только в 4.x)
          .venv-xtts/bin/pip install -q "transformers==4.46.3"

      - name: Клонирование — XTTS-v2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          .venv-xtts/bin/python -u voice-clone/clone.py --model xtts 2>&1 | tee voice-clone/_work/xtts.log

      - name: Окружение Chatterbox 0.5B (отдельный venv)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m venv .venv-cb
            .venv-cb/bin/pip install --upgrade pip -q
            .venv-cb/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .venv-cb/bin/pip install -q chatterbox-tts soundfile imageio-ffmpeg "numpy<2"
          } 2>&1 | tee voice-clone/_work/chatterbox-install.log

      - name: Клонирование — Chatterbox 0.5B
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          .venv-cb/bin/python -u voice-clone/clone.py --model chatterbox 2>&1 | tee voice-clone/_work/chatterbox.log

      - name: Сохранить mp3 + логи в репозиторий (handoff/)
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p voice-clone/_work
          git add handoff voice-clone/_work || true
          if git diff --cached --quiet; then
            echo "Нет новых файлов для коммита"
          else
            git commit -m "Результаты/логи клонирования голоса [skip ci]"
            git pull --rebase origin arena/3c5007be-lsmsnksoslalql
            git push origin HEAD:arena/3c5007be-lsmsnksoslalql
          fi

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloned-voice-mp3
          path: handoff/voice-clone-*.mp3
          if-no-files-found: warn
