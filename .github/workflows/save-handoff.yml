name: Save handoff archive

on:
  push:
    branches:
      - arena/1e52fcec-lsmsnksoslalql
    paths:
      - .github/workflows/save-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: save-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  save-archive:
    if: github.ref == 'refs/heads/arena/1e52fcec-lsmsnksoslalql'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_URL: https://mwmmw-production.up.railway.app/f/RGOnpgsp2dq4bfcFDllygcKXrIZcAx--IqRjIJfpEXw/d247d7c3_46ba_414e_b821_b731d4b67026_ab2fefced0df785fa9f396410d0b5905.zip
      ARCHIVE_PATH: handoff/d247d7c3_46ba_414e_b821_b731d4b67026_ab2fefced0df785fa9f396410d0b5905.zip
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: arena/1e52fcec-lsmsnksoslalql

      - name: Download and validate the ZIP without extracting it
        shell: bash
        run: |
          set -euo pipefail
          temporary_file="$(mktemp)"
          trap 'rm -f "$temporary_file"' EXIT
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            --output "$temporary_file" "$ARCHIVE_URL"
          python3 - "$temporary_file" <<'PY'
          import os
          import sys
          import zipfile

          path = sys.argv[1]
          size = os.path.getsize(path)
          if size >= 100 * 1024 * 1024:
              raise SystemExit("Archive exceeds GitHub's 100 MiB Git file limit.")
          if not zipfile.is_zipfile(path):
              raise SystemExit("The downloaded file is not a valid ZIP archive.")
          with zipfile.ZipFile(path) as archive:
              archive.infolist()
          print(f"Validated ZIP archive: {size} bytes")
          PY
          mkdir -p handoff
          mv "$temporary_file" "$ARCHIVE_PATH"
          sha256sum "$ARCHIVE_PATH"

      - name: Commit the archive to the same working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ARCHIVE_PATH"
          if git diff --cached --quiet; then
            echo "The archive is already saved; no changes to commit."
            exit 0
          fi
          git commit -m "Save ZIP archive in handoff via GitHub Actions"
          git push origin HEAD:arena/1e52fcec-lsmsnksoslalql
