# MilaTTS — обучение голоса (демо-пайплайн или на загруженных mp3)
name: MilaTTS Train

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        required: true
        default: smoke
        type: choice
        options:
          - smoke          # быстрая проверка пайплайна на демо-данных (espeak)
          - voice          # обучение на data/voice_samples (mp3 + metadata.csv)
      steps:
        description: "Количество шагов обучения"
        required: false
        default: "300"
      config:
        description: "Конфиг (configs/*.yaml)"
        required: false
        default: "configs/demo.yaml"

defaults:
  run:
    working-directory: cute-tts

jobs:
  train:
    name: Обучение (CPU-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cute-tts/requirements-*.txt
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt -r requirements-train.txt

      - name: Демо-датасет (режим smoke)
        if: ${{ inputs.mode == 'smoke' }}
        run: python -m training.make_demo_dataset --out data/demo

      - name: Подготовка голоса из mp3 (режим voice)
        if: ${{ inputs.mode == 'voice' }}
        run: |
          if [ ! -f data/voice_samples/metadata.csv ]; then
            echo "Нужен файл data/voice_samples/metadata.csv со строками «файл.mp3|текст»"
            echo "или .txt-транскрипты рядом с mp3 (см. docs/ОБУЧЕНИЕ.md)"
            exit 1
          fi
          python -m training.preprocess --input data/voice_samples --out data/processed \
            --metadata data/voice_samples/metadata.csv

      - name: Обучение
        run: |
          if [ "${{ inputs.mode }}" = "voice" ]; then
            CFG="configs/mila.yaml"
            OUT="models/run_voice"
          else
            CFG="${{ inputs.config }}"
            OUT="models/run_smoke"
          fi
          python -m training.train --config "$CFG" --out "$OUT" \
            --steps "${{ inputs.steps || 300 }}"
          echo "CKPT=$OUT/latest.pt" >> "$GITHUB_ENV"

      - name: Экспорт в ONNX (лимит 100 МБ)
        run: |
          python -m training.export --checkpoint "$CKPT" --out models/mila_voice.onnx

      - name: Проверка синтеза
        run: |
          python -m cute_tts "Привет! Я Мила." -m models/mila_voice.onnx -o check.wav
          ls -la models/*.onnx

      - name: Артефакт (модель)
        uses: actions/upload-artifact@v4
        with:
          name: mila-voice-${{ inputs.mode }}
          path: |
            cute-tts/models/*.onnx
            cute-tts/models/*.json
          if-no-files-found: error
