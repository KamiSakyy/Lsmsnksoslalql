name: Restore original detail and correct the girl rig

on:
  push:
    branches:
      - arena/1e52fcec-lsmsnksoslalql
    paths:
      - .github/workflows/rig-model.yml
      - tools/rigging/**
      - tests/rigging/**
  workflow_dispatch:
    inputs:
      render_previews:
        description: Generate optional offline renders (not required for model files)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rig-girl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rig-and-animate:
    if: github.ref == 'refs/heads/arena/1e52fcec-lsmsnksoslalql'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      RENDER_PREVIEWS: ${{ inputs.render_previews || false }}
      SOURCE_ARCHIVE: handoff/d247d7c3_46ba_414e_b821_b731d4b67026_ab2fefced0df785fa9f396410d0b5905.zip
    steps:
      - name: Check out the same working branch
        uses: actions/checkout@v7.0.1
        with:
          ref: arena/1e52fcec-lsmsnksoslalql

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/rigging/requirements.txt

      - name: Install headless Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 \
            libsm6 libice6 libgl1 libegl1
          python -m pip install -r tools/rigging/requirements.txt

      - name: Set up Node for official Khronos glTF validation
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/rigging/package-lock.json

      - name: Install the official Khronos validator
        run: npm ci --prefix tools/rigging --no-audit --no-fund

      - name: Test source fitting, bounded weights, face transfer and original buffers
        run: python -m unittest discover -s tests/rigging -v

      - name: Build the actual skeleton, skin and animation assets on CPU
        run: |
          set -euo pipefail
          mkdir -p build
          preview_args=()
          if [[ "$RENDER_PREVIEWS" == "true" ]]; then
            preview_args+=(--render)
          fi
          python -X faulthandler tools/rigging/rig_model.py \
            --archive "$SOURCE_ARCHIVE" \
            --output build/rigged \
            --target-triangles 160000 \
            --validate-gltf --quality-renders "${preview_args[@]}" 2>&1 | tee build/rigging.log

      - name: Upload complete editable and full-resolution results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: anime-girl-rigged
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
          path: |
            build/rigged/anime-girl-rigged.glb
            build/rigged/*.fbx
            build/rigged/*.blend
            build/rigged/*.json
            build/rigged/*.png
            build/rigged/*.gif
            build/rigged/README_RU.md
            build/rigged/quality/*.png

      - name: Save the FULL original-resolution model as the main download in Git
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/rigged
          cp build/rigged/anime-girl-rigged.glb handoff/rigged/
          # High-poly FBX/Blender live in the Actions package; do not leave the rejected LOD FBX.
          rm -f -- handoff/rigged/anime-girl-rigged.fbx
          cp build/rigged/joint-fitting.json handoff/rigged/
          mkdir -p handoff/rigged/quality
          cp build/rigged/quality/*.png handoff/rigged/quality/
          cp build/rigged/rig-report.json build/rigged/khronos-validation.json handoff/rigged/
          # Never publish outdated renders as if they belonged to the new model.
          for preview in rest-pose.png skeleton.png animation-preview.gif; do
            if test -f "build/rigged/$preview"; then
              cp "build/rigged/$preview" handoff/rigged/
            else
              rm -f -- "handoff/rigged/$preview"
            fi
          done
          mkdir -p handoff/rigging-diagnostics
          cp build/rigged/rig-report.json build/rigged/khronos-validation.json handoff/rigging-diagnostics/
          grep -E '^\[|\.glb: [0-9]+ errors' build/rigging.log > handoff/rigging-diagnostics/last-run.log
          printf 'Run: %s/%s/actions/runs/%s\nStatus: success\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > handoff/rigging-diagnostics/run.txt
          cp build/rigged/README_RU.md handoff/rigged/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- handoff/rigged handoff/rigging-diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "Save full original-detail GLB with corrected fitted rig and deformation checks"
            git push origin arena/1e52fcec-lsmsnksoslalql
          fi
          {
            echo '## Модель со скелетом и анимациями готова'
            echo '- 48 костей: тело, волосы, пальто, юбка; не более 4 влияний на вершину.'
            echo '- 5 процедурных клипов: Idle, Walk_InPlace, Run_InPlace, Wave, Dance.'
            echo '- ОСНОВНОЙ GLB — исходные 1 159 795 вершин / 1 981 742 треугольника; прямо в handoff/rigged. Эмулятор не нужен.'
            echo '- Внутренняя расчётная поверхность НЕ является выдаваемой моделью. Полноразмерные FBX/Blender: артефакт anime-girl-rigged (90 дней).'
            echo '- Побайтно проверена сохранность исходных геометрии/UV/текстур; исправлена глубина рук/ног; 16-битные веса; 21 время каждого клипа на полном GLB.'
            echo '- Проверка Khronos дополнена проверкой настоящих деформаций и офлайн-рендерами полной модели.'
            echo '- Это автоматический стартовый FK-риг: без мимики, отдельных пальцев и физической ткани.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve diagnostics if any build or validation step fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/rigging-diagnostics
          if test -f build/rigging.log; then
            tail -n 300 build/rigging.log > handoff/rigging-diagnostics/last-run.log
          fi
          for report in khronos-validation.json rig-report.json; do
            if test -f "build/rigged/$report"; then
              cp "build/rigged/$report" handoff/rigging-diagnostics/
            fi
          done
          printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > handoff/rigging-diagnostics/run.txt
          find build/rigged -maxdepth 1 -type f -printf '%f %s bytes\n' >> handoff/rigging-diagnostics/run.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- handoff/rigging-diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "Save rigging failure diagnostics for this working branch"
            git push origin arena/1e52fcec-lsmsnksoslalql
          fi

      - name: Upload diagnostic reports and logs even if validation fails
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rigging-diagnostics-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/rigging.log
            build/rigged/rig-report.json
            build/rigged/khronos-validation.json
