name: Android APK и handoff

on:
  push:
    branches:
      - main
      - arena/8909ba29-lsmsnksoslalql
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noir-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Сборка Android 36 arm64/R8 и handoff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить SDK 36 и Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Настроить Gradle и кэш зависимостей
        uses: gradle/actions/setup-gradle@v6

      - name: Собрать минифицированный arm64 debug APK
        id: build
        env:
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug \
            -PturnUrls="$TURN_URLS" \
            -PturnUsername="$TURN_USERNAME" \
            -PturnCredential="$TURN_CREDENTIAL" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Показать диагностику Gradle при ошибке
        if: failure()
        run: |
          echo "## Ошибка сборки Android" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            tail -n 100 "$RUNNER_TEMP/gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gradle не создал лог сборки." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Подготовить APK и ZIP исходников
        run: |
          set -o pipefail
          (
            set -euo pipefail
            mkdir -p handoff
            APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' ! -path '*androidTest*' 2>/dev/null | sort | head -n 1 || true)"
            if [ -z "$APK_PATH" ]; then
              echo "::error title=APK missing::Gradle завершился без APK; найденные файлы:"
              find app/build/outputs -maxdepth 5 -type f -print || true
              exit 1
            fi
            echo "Использую APK: $APK_PATH"
            cp "$APK_PATH" handoff/NoirP2P-debug.apk
            test -s handoff/NoirP2P-debug.apk
            test -s app/build/outputs/mapping/debug/mapping.txt
            python3 - handoff/NoirP2P-debug.apk <<'APK_CHECK'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              abis = sorted({name.split('/')[1] for name in names
                             if name.startswith('lib/') and len(name.split('/')) > 2})
              if abis != ['arm64-v8a']:
                  raise SystemExit(f'Expected arm64-v8a only, found: {abis}')
              if 'AndroidManifest.xml' not in names:
                  raise SystemExit('APK is missing AndroidManifest.xml')
          print('Verified ABI: arm64-v8a only; debug R8 mapping is present.')
          APK_CHECK
            python3 - <<'PY'
          import pathlib
          import subprocess
          import zipfile

          output = pathlib.Path('handoff/NoirP2P-source.zip')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          excluded_suffixes = ('.apk', '.aab', '.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in tracked:
                  if not name or name.startswith('handoff/') and name.lower().endswith(excluded_suffixes):
                      continue
                  path = pathlib.Path(name)
                  if path.is_file():
                      archive.write(path, arcname='NoirP2P/' + name)
          PY
            {
              echo "## Noir P2P · handoff"
              echo "- APK: \`handoff/NoirP2P-debug.apk\`"
              echo "- Исходники: \`handoff/NoirP2P-source.zip\`"
              echo "- Android API: compile/target 36; min 26"
              echo ""
              echo "Артефакты доступны во вкладке Artifacts этого запуска GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          ) 2>&1 | tee "$RUNNER_TEMP/handoff-package.log"

      - name: Показать диагностику handoff при ошибке
        if: failure()
        run: |
          echo "## Ошибка подготовки APK и исходников" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/handoff-package.log" ]; then
            tail -n 120 "$RUNNER_TEMP/handoff-package.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Лог подготовки handoff не создан." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Загрузить APK и ZIP исходников
        uses: actions/upload-artifact@v7
        with:
          name: NoirP2P-handoff
          path: handoff/
          if-no-files-found: error
          retention-days: 30

  publish-handoff:
    name: Положить свежие файлы в handoff/
    needs: build-apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/8909ba29-lsmsnksoslalql'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Получить ветку с исходниками
        uses: actions/checkout@v7
        with:
          ref: arena/8909ba29-lsmsnksoslalql

      - name: Скачать собранные файлы
        uses: actions/download-artifact@v8
        with:
          name: NoirP2P-handoff
          path: handoff/

      - name: Обновить файлы в GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f handoff/NoirP2P-debug.apk handoff/NoirP2P-source.zip
          if git diff --cached --quiet; then
            echo "handoff/ уже содержит актуальные файлы"
          else
            git commit -m "ci: обновить Android handoff [skip ci]"
            git push origin HEAD:arena/8909ba29-lsmsnksoslalql
          fi
