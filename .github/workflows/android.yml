name: Android release APK и handoff

on:
  push:
    branches:
      - main
      - arena/8909ba29-lsmsnksoslalql
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Собирать APK только после завершения всех функций'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: noir-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    if: github.event_name != 'workflow_dispatch' || inputs.build_apk != true
    name: Java source tests · APK не собирается
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить JDK 21 (libsignal 0.105.0)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Настроить Gradle и кэш
        uses: gradle/actions/setup-gradle@v6

      - name: Компилировать исходники и выполнить JVM unit tests (без сборки APK)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

  build-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
    name: Android 36 arm64 · R8 · release signing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить JDK 21 (libsignal 0.105.0)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить SDK 36 и Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Настроить Gradle и кэш зависимостей
        uses: gradle/actions/setup-gradle@v6

      - name: Назначить монотонную версию приложения
        id: version
        run: |
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Проверить keystore и сертификат подписи
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/handoff/NoirP2P-release-keystore.p12
          KEYSTORE_PASSWORD_PATH: ${{ github.workspace }}/handoff/NoirP2P-release-keystore-password.txt
        run: |
          set -euo pipefail
          if [ ! -s "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PASSWORD_PATH" ]; then
            echo "::error title=Release signing files missing::Нужны handoff/NoirP2P-release-keystore.p12 и handoff/NoirP2P-release-keystore-password.txt."
            exit 1
          fi
          openssl pkcs12 -in "$KEYSTORE_PATH" -clcerts -nokeys \
            -passin "file:$KEYSTORE_PASSWORD_PATH" -out "$RUNNER_TEMP/keystore-cert.pem"
          EXPECTED_CERT="$(openssl x509 -in signing/NoirP2P-release-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          ACTUAL_CERT="$(openssl x509 -in "$RUNNER_TEMP/keystore-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          if [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "::error title=Signing key mismatch::Keystore не совпадает с публичным сертификатом signing/NoirP2P-release-cert.pem. Не заменяйте ключ уже выпущенной версии."
            exit 1
          fi
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Постоянный сертификат подписи совпадает с исходным публичным сертификатом."

      - name: Собрать подписанный release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_SIGNING_KEY_ALIAS: noirp2p-release
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          IFS= read -r ANDROID_SIGNING_STORE_PASSWORD < handoff/NoirP2P-release-keystore-password.txt
          export ANDROID_SIGNING_STORE_PASSWORD
          export ANDROID_SIGNING_KEY_PASSWORD="$ANDROID_SIGNING_STORE_PASSWORD"
          ./gradlew --no-daemon --stacktrace clean assembleRelease \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Показать диагностику Gradle при ошибке
        if: failure()
        run: |
          echo "## Ошибка сборки Android" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            tail -n 100 "$RUNNER_TEMP/gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gradle не создал лог сборки. Для release проверьте наличие keystore и password-файла в handoff/." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Проверить и подготовить APK и ZIP исходников
        if: success()
        env:
          BUILD_VARIANT: release
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p handoff/releases
          APK_PATH="$(find "app/build/outputs/apk/$BUILD_VARIANT" -type f -name '*.apk' ! -path '*androidTest*' 2>/dev/null | sort | head -n 1 || true)"
          if [ -z "$APK_PATH" ]; then
            echo "::error title=APK missing::Gradle завершился без APK в варианте $BUILD_VARIANT."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          test -s "app/build/outputs/mapping/$BUILD_VARIANT/mapping.txt"
          if [ "$BUILD_VARIANT" = "release" ]; then
            APK_TARGET="handoff/NoirP2P-release.apk"
            VERSIONED_APK="handoff/releases/NoirP2P-${APP_VERSION_NAME}+${APP_VERSION_CODE}.apk"
            cp "$APK_PATH" "$APK_TARGET"
            cp "$APK_PATH" "$VERSIONED_APK"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?}}"
            APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
            "$APKSIGNER" verify --verbose --print-certs "$APK_TARGET" > "$RUNNER_TEMP/apk-cert.txt"
            EXPECTED_CERT="$(openssl x509 -in signing/NoirP2P-release-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            ACTUAL_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print $2; exit }' "$RUNNER_TEMP/apk-cert.txt" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [ -z "$ACTUAL_CERT" ] || [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
              echo "::error title=APK signature mismatch::APK подписан не постоянным release-сертификатом."
              cat "$RUNNER_TEMP/apk-cert.txt"
              exit 1
            fi
          else
            APK_TARGET="handoff/NoirP2P-debug.apk"
            cp "$APK_PATH" "$APK_TARGET"
          fi
          test -s "$APK_TARGET"
          python3 - "$APK_TARGET" <<'APK_CHECK'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              abis = sorted({name.split('/')[1] for name in names
                             if name.startswith('lib/') and len(name.split('/')) > 2})
              if abis != ['arm64-v8a']:
                  raise SystemExit(f'Expected arm64-v8a only, found: {abis}')
              if 'AndroidManifest.xml' not in names:
                  raise SystemExit('APK is missing AndroidManifest.xml')
          print('Verified APK manifest, arm64-v8a-only ABI and R8 mapping file.')
          APK_CHECK
          python3 - <<'PY'
          import pathlib
          import subprocess
          import zipfile

          output = pathlib.Path('handoff/NoirP2P-source.zip')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          excluded_suffixes = ('.apk', '.aab', '.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in tracked:
                  if not name or name.startswith('handoff/') and name.lower().endswith(excluded_suffixes):
                      continue
                  path = pathlib.Path(name)
                  if path.is_file():
                      archive.write(path, arcname='NoirP2P/' + name)
          PY
          {
            echo "## Noir P2P · Android $APP_VERSION_NAME ($APP_VERSION_CODE)"
            echo "- Variant: $BUILD_VARIANT"
            echo "- APK: \`$APK_TARGET\`"
            echo "- Исходники: \`handoff/NoirP2P-source.zip\`"
            echo "- ABI: arm64-v8a only · R8 minification/resources enabled"
            if [ "$BUILD_VARIANT" = "release" ]; then
              echo "- APK signed with the persistent release certificate."
              echo "- Старые APK в handoff/releases/ сохраняются; новая версия добавляется отдельным файлом."
            fi
            echo ""
            echo "Файлы текущего запуска находятся во вкладке Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Показать диагностику handoff при ошибке
        if: failure()
        run: |
          echo "## Ошибка подготовки APK и исходников" >> "$GITHUB_STEP_SUMMARY"
          echo "Проверьте логи предыдущих шагов и signing files в handoff/." >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузить signed release APK и исходники
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: NoirP2P-release-v${{ steps.version.outputs.name }}
          path: |
            handoff/NoirP2P-release.apk
            handoff/releases/NoirP2P-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}.apk
            handoff/NoirP2P-source.zip
            signing/NoirP2P-release-cert.pem
          if-no-files-found: error
          retention-days: 30

  publish-handoff:
    name: Опубликовать подписанный release в handoff/
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true && github.ref == 'refs/heads/arena/8909ba29-lsmsnksoslalql'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_VERSION_CODE: ${{ needs.build-apk.outputs.version_code }}
      APP_VERSION_NAME: ${{ needs.build-apk.outputs.version_name }}
    steps:
      - name: Получить ветку с исходниками
        uses: actions/checkout@v7
        with:
          ref: arena/8909ba29-lsmsnksoslalql

      - name: Скачать подписанные файлы
        uses: actions/download-artifact@v8
        with:
          name: NoirP2P-release-v${{ needs.build-apk.outputs.version_name }}
          path: .

      - name: Сохранить новую версию, не удаляя предыдущие
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s handoff/NoirP2P-release.apk
          test -s "handoff/releases/NoirP2P-${APP_VERSION_NAME}+${APP_VERSION_CODE}.apk"
          test -s handoff/NoirP2P-source.zip
          git add -f handoff/NoirP2P-release.apk \
            "handoff/releases/NoirP2P-${APP_VERSION_NAME}+${APP_VERSION_CODE}.apk" \
            handoff/NoirP2P-source.zip signing/NoirP2P-release-cert.pem
          if git diff --cached --quiet; then
            echo "Эта версия уже опубликована; предыдущие APK не удалялись."
          else
            git commit -m "ci: publish Noir P2P ${APP_VERSION_NAME} (${APP_VERSION_CODE}) [skip ci]"
            git push origin HEAD:arena/8909ba29-lsmsnksoslalql
          fi
